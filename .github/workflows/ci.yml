name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  # On main a running build finishes and only the newest waiting push queues behind it,
  # so frequent pushes still produce green builds. Pull requests cancel stale runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data[runtime]:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | tee build.log | tail -n 200

      - name: Build errors
        if: failure()
        run: |
          grep -n -E "error:" build.log | sort -u -t: -k2 | cut -c1-500 | head -60 || true

      - name: Test
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | tee test.log | tail -n 200

      - name: Measurement reports
        if: always()
        run: |
          # Tests that measure (the memory eval, the agent eval) write lines starting "memory eval" or "agent eval"; they show here and in the summary.
          grep -hoE "(memory|agent) eval.*" test.log | sort -u | cut -c1-400 | head -20 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Last test output
        if: failure()
        run: |
          grep -E "✘|recorded an issue|Expectation failed" test.log | cut -c1-500 | head -60 || true
          tail -n 20 test.log || true
          {
            echo "## Test failures"
            echo ""
            echo "Swift Testing (file:line):"
            echo '```'
            grep -E "recorded an issue" test.log | sed -E 's/^✘ Test //' | cut -c1-400 | head -80 || true
            echo '```'
            echo "XCTest and the end-of-run list:"
            echo '```'
            { sed -n '/^Failing tests:/,/^\*\* TEST/p' test.log | head -40; grep -E "error: -\[|Test Case .* failed" test.log | head -40; } | cut -c1-300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No TestResults.xcresult: the build or test step failed first, so there is no coverage to gate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/coverage-gate.sh TestResults.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
