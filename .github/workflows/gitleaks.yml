name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git . --no-banner --redact
  neutral-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Banned reference names
        run: |
          a=atom; m=men; l=lo
          if git grep -n -i -E "${a}ic ?chat|${a}icbot|${a}ic\.chat|${m}${l}"; then
            echo "::error::banned reference name found"; exit 1
          fi
