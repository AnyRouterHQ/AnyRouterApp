name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git . --no-banner --redact
  neutral-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Banned reference names
        run: |
          a=atom; m=men; l=lo
          # One operator-approved exception: a catalog entry's "repo" field may name a model repo of that owner.
          if git grep -n -i -E "${a}ic ?chat|${a}icbot|${a}ic\.chat|${m}${l}" \
            | grep -v -i -E "^catalog/(dev-)?models\.json:[0-9]+: *\"repo\": \"${a}icchat/[A-Za-z0-9._-]+\",?$"; then
            echo "::error::banned reference name found"; exit 1
          fi
      - name: Source sanity (duplicate file names, Swift Testing name clashes)
        run: bash scripts/source-check.sh
      - name: Native-first ratchet
        run: bash scripts/native-ratchet.sh
      - name: Model names carry their logo
        run: bash scripts/model-name-check.sh
