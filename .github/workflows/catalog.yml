name: Catalog

# Cheap check (Ubuntu, no Xcode): every catalog entry must be valid and its file must still exist on Hugging Face
# at the pinned revision with the same size and sha256. Runs only when the catalog or its tooling changes.
on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "scripts/catalog*"
      - ".github/workflows/catalog.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "scripts/catalog*"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate catalog files against Hugging Face
        run: ./scripts/catalog-check.sh
