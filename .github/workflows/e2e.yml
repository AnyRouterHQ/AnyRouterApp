name: E2E (prod)

# UI end-to-end against production AnyRouter with a test account key. Nightly and by hand, never on pull requests,
# so a fork cannot reach the secret. Without the secret the job writes a note and stops.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  # One extra macOS workflow at a time, shared with screenshots, verify-ui, perf, model-smoke and ipad-ui.
  group: extra-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'AnyRouterHQ/AnyRouterApp'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANYROUTER_E2E_API_KEY != '' }}
    steps:
      - name: Skip without the secret
        if: env.HAS_KEY != 'true'
        run: echo "ANYROUTER_E2E_API_KEY is not set, so the prod E2E run was skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'

      - name: Select Xcode 26
        if: env.HAS_KEY == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Cache SwiftPM and DerivedData
        if: env.HAS_KEY == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Install XcodeGen
        if: env.HAS_KEY == 'true'
        run: brew install xcodegen && xcodegen generate

      - name: Pick an iPhone simulator
        if: env.HAS_KEY == 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data[runtime]:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        if: env.HAS_KEY == 'true'
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AnyRouter.xcodeproj -scheme AnyRouterVerify \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tail -n 50

      - name: Run the prod E2E tests
        if: env.HAS_KEY == 'true'
        env:
          TEST_RUNNER_ANYROUTER_E2E_API_KEY: ${{ secrets.ANYROUTER_E2E_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AnyRouter.xcodeproj -scheme AnyRouterVerify \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData -resultBundlePath E2E.xcresult \
            -only-testing:AnyRouterUITests/ProdE2ETests \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: E2E
          path: E2E.xcresult
          retention-days: 7
