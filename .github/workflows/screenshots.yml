name: Screenshots

# Captures every main screen (UITests/ScreenshotTests.swift) on demo data, light and dark, per device.
# One build job, then one capture job per device that reuses the build. Whatever was captured is uploaded
# even when some tests fail. Functional UI tests do not run here: see verify-ui.yml and ci.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

concurrency:
  group: screenshots-${{ github.ref }}
  # Several agents dispatch this; a running capture finishes instead of being cancelled by the next one.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AnyRouter.xcodeproj -scheme AnyRouterScreenshots \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tee build.log | tail -n 100

      - name: Build errors
        if: failure()
        run: |
          grep -n -E "error:" build.log | sort -u -t: -k2 | cut -c1-500 | head -60 || true

      - name: Package build products
        run: tar -C DerivedData/Build -cf build-products.tar Products

      - uses: actions/upload-artifact@v7
        with:
          name: xcbuild-products
          path: build-products.tar
          retention-days: 1
          compression-level: 0

  capture:
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { device: iphone, prefix: "iPhone 1", pro: true }
          - { device: ipad-pro, prefix: "iPad Pro 13", pro: false }
          - { device: ipad-mini, prefix: "iPad mini", pro: false }
    steps:
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - uses: actions/download-artifact@v8
        with:
          name: xcbuild-products

      - name: Unpack build products
        run: mkdir -p DerivedData/Build && tar -C DerivedData/Build -xf build-products.tar

      - name: Pick the simulator
        env:
          PREFIX: ${{ matrix.prefix }}
          PRO: ${{ matrix.pro }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          prefix, pro = os.environ["PREFIX"], os.environ["PRO"] == "true"
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              names = [d for d in data[runtime] if d["isAvailable"] and d["name"].startswith(prefix)]
              if pro:
                  names = [d for d in names if "Pro" in d["name"] and "Max" not in d["name"]]
              names.sort(key=lambda d: d["name"], reverse=True)
              if names:
                  print("SIM_UDID=" + names[0]["udid"])
                  print("SIM_NAME=" + names[0]["name"].replace(" ", "-"))
                  raise SystemExit(0)
          raise SystemExit("no simulator for " + prefix)
          PY

      - name: Capture
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          # A restored DerivedData cache can hold xctestrun files of other schemes; take this scheme's.
          XCTESTRUN=$(ls DerivedData/Build/Products/AnyRouterScreenshots_*.xctestrun | head -1)
          echo "using $XCTESTRUN"
          mkdir -p raw
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/raw" \
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:AnyRouterUITests/ScreenshotTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || echo "some capture tests failed"
          tail -n 60 test.log
          grep -E "Test Case .* (passed|failed)" test.log | sed 's/^.*Test Case //' > results.txt || true
          # No screenshots means the tests did not run (wrong xctestrun, build problem): fail the shard.
          ls raw/*.png >/dev/null 2>&1 || { grep -E "error:" test.log | head -5; echo "no screenshots captured"; exit 1; }

      - name: Name the files
        if: always()
        run: |
          mkdir -p screenshots
          for f in raw/*.png; do
            [ -e "$f" ] && cp "$f" "screenshots/$SIM_NAME-$(basename "$f")"
          done
          cp results.txt "screenshots/$SIM_NAME-results.txt" 2>/dev/null || true
          {
            echo "## $SIM_NAME"
            echo "$(ls screenshots/*.png 2>/dev/null | wc -l) screenshots"
            grep -c " failed " results.txt 2>/dev/null | sed 's/^/failed tests: /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.device }}
          path: screenshots
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestResults-${{ matrix.device }}
          path: TestResults.xcresult
          retention-days: 3

  collect:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: screenshots
      - run: ls screenshots | wc -l
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
