name: Model smoke

# Runs real models on the iOS Simulator. Slow, so it is not part of ci.yml.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Catalog GGUF id (models.json or dev-models.json), like gguf/<repo>/<file>, or a family id (its smallest GGUF size), like inkling-2. Empty runs the smallest GGUF in models.json."
        required: false
        default: ""
      hf_repo:
        description: "Run a GGUF that is not in the catalog: its Hugging Face repo (with hf_file). Shown in the run page, so use hf_from_secrets for private targets."
        required: false
        default: ""
      hf_file:
        description: "File name inside hf_repo, for example model-Q4_K_M.gguf"
        required: false
        default: ""
      max_tokens:
        description: "Token limit of the answer test. Lower it for a model that decodes under 1 token per second."
        required: false
        default: "1024"
      hf_from_secrets:
        description: "Take the repo and file from the SMOKE_HF_REPO and SMOKE_HF_FILE secrets instead. Values are masked in logs."
        type: boolean
        default: false
      skip_agent_eval:
        description: "Skip the agent eval (the LA11 tool-calling set and the memory set, about 40 minutes on a small model)."
        type: boolean
        default: false
      mmproj_file:
        description: "A projector file in the model's repo for the photo test, for a size whose catalog entry has none yet, like mmproj-Inkling-2-Mini-Q8_0.gguf with inkling-2."
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "Engines/Local/**"
      - "catalog/**"
      - "Tests/Integration/**"
      - ".github/workflows/model-smoke.yml"

concurrency:
  # One extra macOS workflow at a time across screenshots, verify-ui, perf, model-smoke and ipad-ui,
  # so main CI and the device build always have runners. A newer waiting run replaces an older waiting one.
  group: extra-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      # An external target (not in the catalog), from the inputs or from secrets. Empty means a catalog model.
      EXT_HF_REPO: ${{ inputs.hf_from_secrets && secrets.SMOKE_HF_REPO || inputs.hf_repo }}
      EXT_HF_FILE: ${{ inputs.hf_from_secrets && secrets.SMOKE_HF_FILE || inputs.hf_file }}
    steps:
      - name: Mask the external target in every log line
        run: |
          for value in "$EXT_HF_REPO" "$EXT_HF_FILE"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick the GGUF to run (the input, else the smallest in the bundled catalog)
        env:
          INPUT_MODEL_ID: ${{ inputs.model_id }}
          INPUT_MMPROJ_FILE: ${{ inputs.mmproj_file }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          env_file = open(os.environ["GITHUB_ENV"], "a")
          def put(line):
              env_file.write(line + "\n")
          def ggufs(path):
              # The catalog lists families with sizes; the app's entry for a size is flat.
              out = []
              for family in json.load(open(path))["families"]:
                  for v in family["variants"]:
                      if v["engine"] == "gguf":
                          out.append({"repo": v["repo"], "format": "gguf", "file": v["file"],
                                      "title": f"{family['name']} {v['params']}", "quantization": v.get("quant"),
                                      "sizeBytes": v["sizeBytes"], "contextLength": v.get("contextLength"),
                                      "revision": v["revision"], "sha256": v.get("sha256"), "vision": v.get("vision"),
                                      "sampling": v.get("sampling"),
                                      "status": family["status"], "family": family["id"]})
              return out
          production = [m for m in ggufs("catalog/models.json") if m["status"] == "current"]
          catalog = production + ggufs("catalog/dev-models.json")
          # A catalog repo whose owner carries the reference app's name (operator-approved data only) is run like a model
          # given at run time: masked in every log line, never named in the report, no artifacts. Pick it by family id.
          a = "atom"
          private_re = re.compile(a + r"ic ?chat|" + a + r"icbot", re.I)
          for m in catalog:
              if private_re.search(m["repo"]):
                  print(f"::add-mask::{m['repo']}", flush=True)
                  print(f"::add-mask::{m['file']}", flush=True)
          wanted = os.environ.get("INPUT_MODEL_ID", "").strip()
          ext_repo, ext_file = os.environ.get("EXT_HF_REPO", "").strip(), os.environ.get("EXT_HF_FILE", "").strip()
          external = False
          if ext_repo or ext_file:
              if not (ext_repo and ext_file):
                  sys.exit("give both a repo and a file, or neither")
              info = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{ext_repo}"))
              rev = info["sha"]
              listing = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{ext_repo}/tree/{rev}?recursive=true"))
              found = next((f for f in listing if f["path"] == ext_file), None)
              if not found or not found.get("lfs"):
                  sys.exit("the file is not in the repo, or is not an LFS file")
              entry = {"repo": ext_repo, "format": "gguf", "file": ext_file, "title": "External model",
                       "sizeBytes": found["size"], "revision": rev, "sha256": found["lfs"]["oid"]}
              external = True
          elif wanted:
              matches = [m for m in catalog if f"gguf/{m['repo']}/{m['file']}" == wanted]
              matches = matches or sorted((m for m in catalog if m["family"] == wanted), key=lambda m: m["sizeBytes"])
              if not matches:
                  sys.exit("no GGUF catalog entry with id " + wanted + ". Known: " + ", ".join(f"gguf/{m['repo']}/{m['file']}" for m in catalog))
              entry = matches[0]
          else:
              entry = min(production, key=lambda m: m.get("sizeBytes", 1 << 62))
          entry.pop("family", None)
          external = external or bool(private_re.search(entry["repo"]))
          repo, file, rev = entry["repo"], entry["file"], entry["revision"]
          listing = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/{rev}?recursive=true"))
          sha = next(f["lfs"]["oid"] for f in listing if f["path"] == file)
          # A projector the catalog does not list yet: the photo test runs it as if the entry named it.
          extra = os.environ.get("INPUT_MMPROJ_FILE", "").strip()
          if extra:
              found = next((f for f in listing if f["path"] == extra), None)
              if not found or not found.get("lfs"):
                  sys.exit("the projector is not in the model's repo, or is not an LFS file")
              if external:
                  print(f"::add-mask::{extra}", flush=True)
              entry["vision"] = {"mmprojFile": extra, "mmprojSize": found["size"]}
          put(f"MODEL_REPO={repo}")
          put(f"MODEL_FILE={file}")
          put(f"MODEL_REV={rev}")
          put(f"MODEL_SHA256={sha}")
          # A size that takes photos: the projector is downloaded too, for the image test.
          vision = entry.get("vision") or {}
          projector = vision.get("mmprojFile", "")
          put(f"MODEL_MMPROJ_FILE={projector}")
          put("MODEL_MMPROJ_SHA256=" + (next(f["lfs"]["oid"] for f in listing if f["path"] == projector) if projector else ""))
          put(f"MODEL_TITLE={entry['title']}")
          put(f"MODEL_ID={'external' if external else 'gguf/' + repo + '/' + file}")
          put(f"MODEL_EXTERNAL={'1' if external else ''}")
          # A file over 4 GB is downloaded each run: the repo's 10 GB cache would evict every other entry to hold it.
          put(f"MODEL_BIG={'1' if entry['sizeBytes'] > 4_000_000_000 else ''}")
          put("MODEL_ENTRY_JSON=" + json.dumps(entry, separators=(",", ":")))
          PY

      - name: Cache the model file
        id: model-cache
        if: env.MODEL_EXTERNAL != '1' && env.MODEL_BIG != '1'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/model
          key: gguf-${{ env.MODEL_SHA256 }}

      - name: Download the model
        if: env.MODEL_EXTERNAL == '1' || steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          # A file inside a folder of the repo keeps that folder.
          curl -L --fail --retry 5 --retry-delay 5 --create-dirs -o "$RUNNER_TEMP/model/$MODEL_FILE" \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REV/$MODEL_FILE"

      - name: Download the image projector (a size that takes photos)
        if: env.MODEL_MMPROJ_FILE != ''
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          if [ ! -f "$RUNNER_TEMP/model/$MODEL_MMPROJ_FILE" ]; then
            curl -L --fail --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/model/$MODEL_MMPROJ_FILE" \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REV/$MODEL_MMPROJ_FILE"
          fi
          ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/model/$MODEL_MMPROJ_FILE" | cut -d' ' -f1)
          test "$ACTUAL" = "$MODEL_MMPROJ_SHA256"

      - name: Check the model file
        run: |
          ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/model/$MODEL_FILE" | cut -d' ' -f1)
          echo "expected $MODEL_SHA256"
          echo "actual   $ACTUAL"
          test "$ACTUAL" = "$MODEL_SHA256"

      - name: Fetch the Gemma 4 MLX tokenizer files (chat template check, no weights)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "mlx-community/gemma-4-e2b-it-4bit"
          catalog = json.load(open("catalog/models.json"))
          rev = next(v["revision"] for f in catalog["families"] for v in f["variants"] if v["repo"] == repo)
          out = os.path.join(os.environ["RUNNER_TEMP"], "mlx-tokenizer")
          os.makedirs(out, exist_ok=True)
          for name in ["config.json", "tokenizer_config.json", "tokenizer.json", "chat_template.jinja"]:
              urllib.request.urlretrieve(f"https://huggingface.co/{repo}/resolve/{rev}/{name}", os.path.join(out, name))
          PY

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data[runtime]:
                  if d["name"].startswith("iPhone") and d["isAvailable"]:
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tee build.log | tail -n 200

      - name: Build errors
        if: failure()
        run: |
          grep -n -E "error:" build.log | sort -u -t: -k2 | cut -c1-500 | head -60 || true

      - name: Run smoke tests
        env:
          TEST_RUNNER_ANYROUTER_SMOKE: "1"
          TEST_RUNNER_ANYROUTER_SMOKE_GGUF_PATH: ${{ runner.temp }}/model/${{ env.MODEL_FILE }}
          TEST_RUNNER_ANYROUTER_SMOKE_GGUF_SHA256: ${{ env.MODEL_SHA256 }}
          TEST_RUNNER_ANYROUTER_SMOKE_MMPROJ_FILE: ${{ env.MODEL_MMPROJ_FILE }}
          TEST_RUNNER_ANYROUTER_SMOKE_MMPROJ_SHA256: ${{ env.MODEL_MMPROJ_SHA256 }}
          TEST_RUNNER_ANYROUTER_SMOKE_MAX_TOKENS: ${{ inputs.max_tokens }}
          TEST_RUNNER_ANYROUTER_SMOKE_EXTERNAL: ${{ env.MODEL_EXTERNAL }}
          TEST_RUNNER_ANYROUTER_SMOKE_ENTRY_JSON: ${{ env.MODEL_ENTRY_JSON }}
          TEST_RUNNER_ANYROUTER_SMOKE_MLX_TOKENIZER_DIR: ${{ runner.temp }}/mlx-tokenizer
          TEST_RUNNER_ANYROUTER_SMOKE_REPORT: ${{ runner.temp }}/smoke-report.md
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath SmokeResults.xcresult \
            -only-testing:AnyRouterTests/GGUFModelSmokeTests \
            -only-testing:AnyRouterTests/ModelDownloadSmokeTests \
            -only-testing:AnyRouterTests/MLXChatTemplateSmokeTests \
            -only-testing:AnyRouterTests/AppleFoundationSmokeTests \
            CODE_SIGNING_ALLOWED=NO | tee test.log | tail -n 200

      # The agent eval (PLAN D28 unit L1, agent design 5.2 and 5.3): the tool-calling set through the real engine and the
      # app's tool loop. It reports numbers and does not fail on the model's skill, only when its own harness breaks.
      # The JSON goes to the AgentEval artifact; the "agent eval" lines go to the job summary (next step).
      - name: Run agent eval
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.skip_agent_eval }}
        timeout-minutes: 90
        env:
          TEST_RUNNER_ANYROUTER_SMOKE: "1"
          TEST_RUNNER_ANYROUTER_SMOKE_GGUF_PATH: ${{ runner.temp }}/model/${{ env.MODEL_FILE }}
          TEST_RUNNER_ANYROUTER_SMOKE_GGUF_SHA256: ${{ env.MODEL_SHA256 }}
          TEST_RUNNER_ANYROUTER_SMOKE_MAX_TOKENS: ${{ inputs.max_tokens }}
          TEST_RUNNER_ANYROUTER_SMOKE_EXTERNAL: ${{ env.MODEL_EXTERNAL }}
          TEST_RUNNER_ANYROUTER_SMOKE_ENTRY_JSON: ${{ env.MODEL_ENTRY_JSON }}
          TEST_RUNNER_ANYROUTER_SMOKE_REPORT: ${{ runner.temp }}/smoke-report.md
          TEST_RUNNER_ANYROUTER_SMOKE_AGENT_EVAL_JSON: ${{ runner.temp }}/agent-eval.json
          TEST_RUNNER_ANYROUTER_SMOKE_EVAL_MINUTES: "40"
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:AnyRouterTests/AgentToolEvalSmokeTests \
            -only-testing:AnyRouterTests/AgentMemoryEvalSmokeTests \
            CODE_SIGNING_ALLOWED=NO | tee agent-eval.log | tail -n 100

      - name: Agent eval report
        if: always()
        run: |
          # Lines starting "agent eval" (see AgentEvalSupport.swift) go to the summary, like ci.yml's "Measurement reports".
          # If the log has none, the JSON report's own copy of them is used.
          [ -f "$RUNNER_TEMP/agent-eval.json" ] && cp "$RUNNER_TEMP/agent-eval.json" agent-eval.json
          LINES=""
          if [ -f agent-eval.log ]; then LINES=$(grep -hoE "agent eval (tools|memory).*" agent-eval.log | sort -u | cut -c1-500 | head -20 || true); fi
          if [ -z "$LINES" ] && [ -f agent-eval.json ]; then
            LINES=$(python3 -c 'import json; d = json.load(open("agent-eval.json")); print("\n".join(l for s in d.values() if isinstance(s, dict) for l in s.get("lines", [])))')
          fi
          {
            echo "## Agent eval"
            echo
            if [ -n "$LINES" ]; then echo '```'; echo "$LINES"; echo '```'; else echo "No agent eval line: it did not run or was skipped, see the test log."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Model smoke"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            if [ -f "$RUNNER_TEMP/smoke-report.md" ]; then cat "$RUNNER_TEMP/smoke-report.md"; else echo "| report | none written, see the test log |"; fi
            echo "| MLX | device only, the Simulator has no Metal GPU family |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The run step prints only the last 200 lines, so failures are listed here from the whole log: file:line and message.
      # A model given at run time may be private: its failure messages can carry its output, so only file:line is kept.
      - name: Test failures
        if: failure()
        run: |
          {
            echo "## Test failures"
            echo
            echo '```'
            if [ -f test.log ]; then
              if [ "$MODEL_EXTERNAL" = "1" ]; then
                grep -E "error: -\[" test.log | sed -E 's/^(.*\.swift:[0-9]+): error: -\[([^ ]+ [^]]+)\].*/\1 \2 (message not printed for a model given at run time)/' | head -40 || true
              else
                grep -E "error: -\[|XCTAssert|failed:|recorded an issue" test.log | cut -c1-500 | head -60 || true
              fi
              sed -n '/^Failing tests:/,/^\*\* TEST/p' test.log | head -40
            else
              echo "No test.log: the build step failed first."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the full logs
        # Not for a model given at run time: a log can name its file, and artifacts are not masked.
        if: always() && env.MODEL_EXTERNAL != '1'
        uses: actions/upload-artifact@v7
        with:
          name: SmokeLogs
          path: |
            build.log
            test.log
            agent-eval.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the agent eval report
        # Not for a model given at run time, like the logs.
        if: always() && env.MODEL_EXTERNAL != '1'
        uses: actions/upload-artifact@v7
        with:
          name: AgentEval
          path: agent-eval.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        # The result bundle can name the model file too: not uploaded for a model given at run time.
        if: always() && env.MODEL_EXTERNAL != '1'
        uses: actions/upload-artifact@v7
        with:
          name: SmokeResults
          path: SmokeResults.xcresult
          retention-days: 7
