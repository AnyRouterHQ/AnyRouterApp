name: Verify UI

# Drives user journeys (UITests/Journeys) and the functional UI tests (UITests/*Tests.swift, "flows") on demo data
# in the iOS Simulator, with one build. Uploads evidence: a screenshot at every journey step, accessibility audit
# findings, an xcresult summary per device, results-<device>.txt and journeys.md.
# Run it with: gh workflow run verify-ui.yml --ref main -f journeys=theme -f flows=none
# (see .claude/skills/verify-anyrouter-ios). Nightly it runs everything on iPhone and iPad.
on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Comma list of journeys (theme, drawer, composer, model-picker, settings, hub, response-details), all, or none"
        default: all
      flows:
        description: "Comma list of UITests classes (for example KeyboardTests,ThemeTests), all, or none"
        default: none
      ipad:
        description: "Also run on an iPad Pro 13-inch simulator"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: verify-ui-${{ github.ref }}
  # Runner budget: a run in progress finishes; the next one waits.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      JOURNEYS: ${{ inputs.journeys || 'all' }}
      FLOWS: ${{ inputs.flows || (github.event_name == 'schedule' && 'all' || 'none') }}
      WITH_IPAD: ${{ inputs.ipad || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulators
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          def pick(prefix, want_pro=False):
              for runtime in sorted(data, reverse=True):
                  if "iOS" not in runtime:
                      continue
                  names = [d for d in data[runtime] if d["isAvailable"] and d["name"].startswith(prefix)]
                  if want_pro:
                      names = [d for d in names if "Pro" in d["name"] and "Max" not in d["name"]]
                  names.sort(key=lambda d: d["name"], reverse=True)
                  if names:
                      return names[0]
              raise SystemExit("no simulator for " + prefix)
          iphone = pick("iPhone 1", want_pro=True)
          ipad = pick("iPad Pro 13")
          print("IPHONE_UDID=" + iphone["udid"])
          print("IPHONE_NAME=" + iphone["name"].replace(" ", "-"))
          print("IPAD_UDID=" + ipad["udid"])
          print("IPAD_NAME=" + ipad["name"].replace(" ", "-"))
          PY

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AnyRouter.xcodeproj -scheme AnyRouterVerify \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tail -n 100

      - name: Run journeys
        run: |
          mkdir -p evidence
          only=(); skip=()
          case "$JOURNEYS" in
            none|"") ;;
            all) only+=("-only-testing:AnyRouterJourneys") ;;
            *)
              for id in $(echo "$JOURNEYS" | tr ',' ' '); do
                case "$id" in
                  theme) c=ThemeJourney ;;
                  drawer) c=DrawerJourney ;;
                  composer) c=ComposerJourney ;;
                  model-picker) c=ModelPickerJourney ;;
                  settings) c=SettingsJourney ;;
                  hub) c=HubJourney ;;
                  response-details) c=ResponseDetailsJourney ;;
                  *) echo "unknown journey: $id"; exit 2 ;;
                esac
                only+=("-only-testing:AnyRouterJourneys/$c")
              done ;;
          esac
          case "$FLOWS" in
            none|"") ;;
            all)
              only+=("-only-testing:AnyRouterUITests")
              # Screenshots have their own workflow, performance has perf.yml.
              skip+=("-skip-testing:AnyRouterUITests/ScreenshotTests" "-skip-testing:AnyRouterUITests/PerformanceTests") ;;
            *)
              for c in $(echo "$FLOWS" | tr ',' ' '); do only+=("-only-testing:AnyRouterUITests/$c"); done ;;
          esac
          if [ ${#only[@]} -eq 0 ]; then echo "nothing selected: set journeys or flows"; exit 2; fi
          devices="IPHONE"
          [ "$WITH_IPAD" = "true" ] && devices="IPHONE IPAD"
          for device in $devices; do
            udid_var="${device}_UDID"; name_var="${device}_NAME"
            udid="${!udid_var}"; name="${!name_var}"
            xcrun simctl bootstatus "$udid" -b
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/evidence/$name" \
            xcodebuild test-without-building \
              -project AnyRouter.xcodeproj -scheme AnyRouterVerify \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath DerivedData \
              -resultBundlePath "TestResults-$name.xcresult" \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 240 \
              -maximum-test-execution-time-allowance 420 \
              "${only[@]}" "${skip[@]}" \
              CODE_SIGNING_ALLOWED=NO > "test-$name.log" 2>&1 || echo "FAILED=$name" >> failed.txt
            tail -n 40 "test-$name.log"
            grep -E "Test Case .* (passed|failed)" "test-$name.log" | sed 's/^.*Test Case //' > "evidence/results-$name.txt" || true
            xcrun xcresulttool get test-results summary --path "TestResults-$name.xcresult" --compact > "evidence/summary-$name.json" || true
          done
          test ! -e failed.txt || { cat failed.txt; exit 1; }

      - name: Report
        if: always()
        run: |
          python3 .claude/skills/verify-anyrouter-ios/scripts/journeys-report.py evidence > evidence/journeys.md || true
          cat evidence/journeys.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-evidence
          path: evidence
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: TestResults
          path: TestResults-*.xcresult
          retention-days: 7
