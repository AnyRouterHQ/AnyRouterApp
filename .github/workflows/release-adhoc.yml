name: Release (ad-hoc)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-adhoc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adhoc:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_ADHOC_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            {
              echo "## Ad-hoc build skipped"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them as described in docs/install.md, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - name: Select Xcode 26
        if: steps.secrets.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Import certificate and profile
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/adhoc-setup-signing.sh

      - name: Generate project
        if: steps.secrets.outputs.ready == 'true'
        run: xcodegen generate

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AnyRouter.xcodeproj -scheme AnyRouter \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AnyRouter.xcarchive" \
            -clonedSourcePackagesDirPath SourcePackages \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" | tail -n 200

      - name: Export IPA (ad-hoc)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          sed -e "s|__TEAM_ID__|$APPLE_TEAM_ID|" -e "s|__PROFILE_NAME__|$PROFILE_NAME|" \
            scripts/ExportOptions.plist.template > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AnyRouter.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tail -n 100
          mkdir -p dist
          cp "$RUNNER_TEMP"/export/*.ipa dist/AnyRouter.ipa
          cp -R "$RUNNER_TEMP/AnyRouter.xcarchive/dSYMs" dist/dSYMs

      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SIZE=$(du -h dist/AnyRouter.ipa | cut -f1)
          {
            echo "## Ad-hoc build"
            echo
            echo "IPA size: $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AnyRouter-adhoc
          path: |
            dist/AnyRouter.ipa
            dist/dSYMs
          retention-days: 30

      - name: Attach to GitHub release
        if: steps.secrets.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/AnyRouter.ipa --clobber

      - name: Delete temporary keychain
        if: always() && steps.secrets.outputs.ready == 'true'
        run: bash scripts/adhoc-cleanup-signing.sh
