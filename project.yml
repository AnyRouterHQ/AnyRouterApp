name: AnyRouter
options:
  bundleIdPrefix: oneni.anyr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    SUPPORTS_MACCATALYST: NO
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      STRIP_INSTALLED_PRODUCT: YES
      ENABLE_TESTABILITY: NO
# Add SPM packages here (lane B/C). Say so in the PR.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  LlamaBinary:
    path: Packages/LlamaBinary
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.33.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.3.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.36.0
  # Whisper speech to text and TTSKit text to speech (MIT, Core ML). Its only package dependency is swift-argument-parser, used by its CLI target, not by the WhisperKit product. It carries its own copy of a tokenizer inside the ArgmaxCore module, so it does not clash with swift-transformers.
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  # Already in the build through swift-transformers. Declared so GGUF models can render their own chat template.
  swift-jinja:
    url: https://github.com/huggingface/swift-jinja
    from: 2.4.2
targets:
  AnyRouter:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Design
        optional: true
      - path: Features
        optional: true
      - path: Engines
        optional: true
      - path: Shared
      - path: catalog/models.json
      - path: catalog/voice-models.json
      - path: catalog/decision-apps.json
    excludes:
      - "**/.gitkeep"
    info:
      path: App/Info.plist
      properties:
        SentryDSN: $(SENTRY_DSN)
        ARGitCommit: $(AR_GIT_COMMIT)
        NSCameraUsageDescription: AnyRouter uses the camera to attach a photo to a message.
        NSMicrophoneUsageDescription: AnyRouter uses the microphone to turn your speech into text on this device.
        NSSpeechRecognitionUsageDescription: AnyRouter uses speech recognition to turn your speech into text. Recognition runs on this device.
        # `anyrouter://share` and `anyrouter://ask`: how the share extension asks the app to open.
        CFBundleURLTypes:
          - CFBundleURLName: oneni.anyr.app
            CFBundleURLSchemes:
              - anyrouter
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: LlamaBinary
        product: llama
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-jinja
        product: Jinja
      - package: Sentry
        product: Sentry
      - package: argmax-oss-swift
        product: WhisperKit
      - package: argmax-oss-swift
        product: TTSKit
      # The Control Center and Lock Screen controls and the share extension, embedded in the app's PlugIns folder.
      - target: AnyRouterControls
      - target: AnyRouterShare
    settings:
      base:
        # Private Cloud Compute (Apple Foundation Models on Apple's servers) is in the iOS 27 SDK only. The code that names
        # it compiles when the SDK is 27 (the ios27-build workflow), so the iOS 26 SDK builds stay as they are.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": $(inherited) APPLE_PCC_SDK
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": $(inherited) APPLE_PCC_SDK
        # The app's entitlements are committed files, chosen by AR_PCC_ENTITLEMENT in Config/Base.xcconfig (off by default):
        # - increased-memory-limit and extended-virtual-addressing: llama.cpp maps a model file whole; without the second
        #   the address space is capped (about 7.4 GiB on a phone with more than 3 GiB of RAM). Paid teams only: a free
        #   Apple ID drops both, and Settings › Diagnostics shows whether this install has them.
        # - the App Group: shares from the extension wait there for the app.
        # - AnyRouter-PCC.entitlements adds com.apple.developer.private-cloud-compute, which Apple grants per account.
        #   A key the App ID lacks breaks signing, so it stays off until the account has it (docs/testflight.md).
        CODE_SIGN_ENTITLEMENTS: $(AR_ENTITLEMENTS_$(AR_PCC_ENTITLEMENT))
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The Mac build is "Designed for iPad": the iOS device build runs on Apple silicon (the llama.xcframework has no macOS or Catalyst slice).
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AnyRouterControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls
      # The intents the controls run, and the mailbox they leave a request in. Also compiled into the app.
      - path: Shared
        excludes:
          - ShareHandoff.swift
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: AnyRouter Controls
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: AnyRouterControls
        PRODUCT_BUNDLE_IDENTIFIER: oneni.anyr.app.controls
        INFOPLIST_KEY_CFBundleDisplayName: AnyRouter Controls
        SKIP_INSTALL: YES
  AnyRouterShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      # The handoff types the app also compiles.
      - path: Shared
        excludes:
          - ControlIntents.swift
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Ask AnyRouter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: Share/AnyRouterShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.oneni.anyr.app
    settings:
      base:
        PRODUCT_NAME: AnyRouterShare
        PRODUCT_BUNDLE_IDENTIFIER: oneni.anyr.app.share
        INFOPLIST_KEY_CFBundleDisplayName: Ask AnyRouter
        SKIP_INSTALL: YES
        # NSItemProvider and the responder chain predate Sendable. The glue stays in Swift 5 mode; the app is Swift 6.
        SWIFT_VERSION: "5.0"
  AnyRouterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    excludes:
      - "**/.gitkeep"
    dependencies:
      - target: AnyRouter
    settings:
      base:
        PRODUCT_NAME: AnyRouterTests
        PRODUCT_BUNDLE_IDENTIFIER: oneni.anyr.app.tests
        INFOPLIST_KEY_CFBundleDisplayName: AnyRouterTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AnyRouter.app/AnyRouter"
  AnyRouterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    excludes:
      - "Journeys/**"
    dependencies:
      - target: AnyRouter
    settings:
      base:
        PRODUCT_NAME: AnyRouterUITests
        PRODUCT_BUNDLE_IDENTIFIER: oneni.anyr.app.uitests
        TEST_TARGET_NAME: AnyRouter
  AnyRouterJourneys:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/Journeys
    dependencies:
      - target: AnyRouter
    settings:
      base:
        PRODUCT_NAME: AnyRouterJourneys
        PRODUCT_BUNDLE_IDENTIFIER: oneni.anyr.app.journeys
        TEST_TARGET_NAME: AnyRouter
schemes:
  AnyRouterVerify:
    build:
      targets:
        AnyRouter: all
        AnyRouterJourneys: [test]
        AnyRouterUITests: [test]
    test:
      targets:
        - AnyRouterJourneys
        - AnyRouterUITests
  AnyRouterScreenshots:
    build:
      targets:
        AnyRouter: all
        AnyRouterUITests: [test]
    test:
      targets:
        - AnyRouterUITests
  AnyRouter:
    build:
      targets:
        AnyRouter: all
        AnyRouterTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - AnyRouter
      targets:
        - AnyRouterTests
