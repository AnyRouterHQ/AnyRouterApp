name: AnyRouter
options:
  bundleIdPrefix: dev.anyrouter
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    SUPPORTS_MACCATALYST: NO
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      STRIP_INSTALLED_PRODUCT: YES
      ENABLE_TESTABILITY: NO
# Add SPM packages here (lane B/C). Say so in the PR.
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  LlamaBinary:
    path: Packages/LlamaBinary
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.33.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.3.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.36.0
  # Already in the build through swift-transformers. Declared so GGUF models can render their own chat template.
  swift-jinja:
    url: https://github.com/huggingface/swift-jinja
    from: 2.4.2
targets:
  AnyRouter:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Design
        optional: true
      - path: Features
        optional: true
      - path: Engines
        optional: true
      - path: catalog/models.json
    excludes:
      - "**/.gitkeep"
    info:
      path: App/Info.plist
      properties:
        SentryDSN: $(SENTRY_DSN)
        ARGitCommit: $(AR_GIT_COMMIT)
        NSCameraUsageDescription: AnyRouter uses the camera to attach a photo to a message.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
    entitlements:
      path: App/AnyRouter.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: LlamaBinary
        product: llama
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-jinja
        product: Jinja
      - package: Sentry
        product: Sentry
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AnyRouterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    excludes:
      - "**/.gitkeep"
    dependencies:
      - target: AnyRouter
    settings:
      base:
        PRODUCT_NAME: AnyRouterTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.anyrouter.app.tests
        INFOPLIST_KEY_CFBundleDisplayName: AnyRouterTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AnyRouter.app/AnyRouter"
  AnyRouterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AnyRouter
    settings:
      base:
        PRODUCT_NAME: AnyRouterUITests
        PRODUCT_BUNDLE_IDENTIFIER: dev.anyrouter.app.uitests
        TEST_TARGET_NAME: AnyRouter
schemes:
  AnyRouterScreenshots:
    build:
      targets:
        AnyRouter: all
        AnyRouterUITests: [test]
    test:
      targets:
        - AnyRouterUITests
  AnyRouter:
    build:
      targets:
        AnyRouter: all
        AnyRouterTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - AnyRouter
      targets:
        - AnyRouterTests
